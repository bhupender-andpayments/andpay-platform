<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Strict CSP: no inline scripts, no eval, self-only. The production header
         is applied at the CloudFront/WAF edge (deploy-bound); this meta mirrors it
         for dev so a token-exfil inline-script surface never works locally.

         frame-ancestors IS DELIBERATELY ABSENT HERE. A meta-delivered CSP
         cannot express it: the browser logs "The Content Security Policy
         directive 'frame-ancestors' is ignored when delivered via a <meta>
         element" and drops it. Listing it anyway is worse than omitting it,
         because it reads as clickjacking protection that does not exist.
         The real control MUST be an HTTP response header on the document, set
         by whatever serves this SPA (E-8 / E-9):
           Content-Security-Policy: ... frame-ancestors 'none'
           X-Frame-Options: DENY
         The API edges now send both on every response (@andpay/edge
         applyApiSecurityHeaders); the DOCUMENT is served by the CDN, so its
         header is a deploy-time obligation, not something this file can fix.

         frame-src carries blob: because the collateral proof pane shows an
         in-memory PDF through an iframe whose src is a blob: URL the app itself
         created. Without it, frame-src falls back to default-src 'self', Chrome
         blocks the frame, and the proof renders as an empty grey box. blob:
         frames are same-origin documents this page minted; script execution
         stays governed by script-src 'self'. The production edge header must
         carry the same directive or the proof pane goes grey again in prod. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:*; img-src 'self' data:; frame-src 'self' blob:; base-uri 'none'; object-src 'none'" />
    <title>AndPayments Ops</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
